name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          setup-android: 'true'
      - name: Build APK
        run: bash ./gradlew :androidApp:assembleRelease --stacktrace
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_B64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: signed-apk
          path: androidApp/build/outputs/apk/release/androidApp-release-signed.apk

  dmg:
    name: Generate DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          setup-android: 'true'
      - name: Build DMG
        run: bash ./gradlew packageReleaseDmg --stacktrace
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dmg-package
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

  msi:
    name: Generate MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          setup-android: 'true'
      - name: Build MSI
        shell: bash
        run: ./gradlew packageReleaseMsi --stacktrace
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

  linux-packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Generate DEB
            build: ./gradlew packageReleaseDeb --stacktrace
            setup-cmd: ""
            upload-name: deb-package
            upload-path: composeApp/build/compose/binaries/main-release/deb/*.deb

          - name: Generate RPM
            build: ./gradlew packageReleaseRpm --stacktrace
            setup-cmd: sudo apt-get update && sudo apt-get install -y rpm
            upload-name: rpm-package
            upload-path: composeApp/build/compose/binaries/main-release/rpm/*.rpm

          - name: Generate Linux Tarball
            build: |
              ./gradlew createReleaseDistributable --stacktrace
              cd composeApp/build/compose/binaries/main-release/app
              tar czf "$GITHUB_WORKSPACE/Oak-linux-x86_64.tar.gz" Oak
            setup-cmd: ""
            upload-name: linux-tar-package
            upload-path: Oak-linux-x86_64.tar.gz

          - name: Generate AppImage
            build: |
              ./gradlew createReleaseDistributable --stacktrace
              mkdir -p AppDir/usr/bin
              mkdir -p AppDir/usr/lib
              mkdir -p AppDir/usr/share/applications
              mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
              cp -r composeApp/build/compose/binaries/main-release/app/Oak/* AppDir/usr/lib/
              cp composeApp/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/oak.png
              cp composeApp/icon.png AppDir/oak.png
              cat > AppDir/oak.desktop << 'DESKTOP_EOF'
              [Desktop Entry]
              Name=Oak
              Comment=AI Assistant Application
              Exec=oak
              Icon=oak
              Type=Application
              Categories=Utility;
              Terminal=false
              DESKTOP_EOF
              cp AppDir/oak.desktop AppDir/usr/share/applications/
              cat > AppDir/AppRun << 'APPRUN_EOF'
              #!/bin/bash
              SELF=$(readlink -f "$0")
              HERE=${SELF%/*}
              export PATH="${HERE}/usr/lib/bin:${PATH}"
              export LD_LIBRARY_PATH="${HERE}/usr/lib/lib/runtime/lib:${LD_LIBRARY_PATH}"
              exec "${HERE}/usr/lib/bin/Oak" "$@"
              APPRUN_EOF
              chmod +x AppDir/AppRun
              ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Oak-x86_64.AppImage
            setup-cmd: |
              sudo apt-get update
              sudo apt-get install -y libfuse2 file
              wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool-x86_64.AppImage
            upload-name: appimage-package
            upload-path: Oak-*.AppImage

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install platform-specific tools
        if: ${{ matrix.setup-cmd != '' }}
        run: ${{ matrix.setup-cmd }}
      - name: Build
        run: ${{ matrix.build }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.upload-name }}
          path: ${{ matrix.upload-path }}

  release:
    name: Create GitHub Release
    needs: [apk, dmg, msi, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: signed-apk

      - name: Download DMG Artifact
        uses: actions/download-artifact@v8
        with:
          name: dmg-package

      - name: Download MSI Artifact
        uses: actions/download-artifact@v8
        with:
          name: msi-package

      - name: Download DEB Artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-package

      - name: Download RPM Artifact
        uses: actions/download-artifact@v8
        with:
          name: rpm-package

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v8
        with:
          name: appimage-package

      - name: Download Linux Tarball Artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-tar-package

      - name: List downloaded files
        run: ls -la

      - name: Rename assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv androidApp-release-signed.apk "Oak-${VERSION}-android.apk"
          mv *.dmg "Oak-${VERSION}-macos.dmg"
          mv *.msi "Oak-${VERSION}-windows.msi"
          mv *.deb "Oak-${VERSION}-linux.deb"
          mv *.rpm "Oak-${VERSION}-linux.rpm"
          mv *.AppImage "Oak-${VERSION}-linux.AppImage"
          mv Oak-linux-x86_64.tar.gz "Oak-${VERSION}-linux-x86_64.tar.gz"

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" CHANGELOG.md > changelog.txt
          fi
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" "${GITHUB_REF_NAME}" > changelog.txt
            else
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --no-merges > changelog.txt
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.txt
          files: Oak-*
