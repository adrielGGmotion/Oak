name: PR Checks

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  check-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|chore|docs|refactor|test|deps|revert)(\(.+\))?!?:\s.+/;
            if (!pattern.test(title)) {
              core.setFailed(
                'PR title must follow conventional commits format: ' +
                '`type(scope): description` — e.g. `feat: add widget`, `fix(android): crash on rotate`\n\n' +
                'Types: feat, fix, chore, docs, refactor, test, deps, revert'
              );
            }

  label:
    name: Label PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
