name: "PR Title Check"

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|chore|docs|refactor|test|deps|revert)(\(.+\))?!?:\s.+/;
            if (!pattern.test(title)) {
              core.setFailed(
                'PR title must follow conventional commits format: ' +
                '`type(scope): description` — e.g. `feat: add widget`, `fix(android): crash on rotate`\n\n' +
                'Types: feat, fix, chore, docs, refactor, test, deps, revert'
              );
            }
