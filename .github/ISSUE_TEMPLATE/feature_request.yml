name: Feature Request
description: Suggest an idea for Oak
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else have you considered?
  - type: checkboxes
    id: plan
    attributes:
      label: Planning
      description: Before coding this feature, examine → plan → execute → test → review
      options:
        - label: I've thought about the implementation approach
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, mockups, references, etc.
