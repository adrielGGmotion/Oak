name: 'Setup Oak Build Environment'
description: 'Sets up JDK, Gradle caching, and optionally Android SDK'
inputs:
  setup-android:
    description: 'Whether to setup Android SDK'
    required: false
    default: 'false'
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'

runs:
  using: 'composite'
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set execution flag for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: Setup Android SDK
      if: ${{ inputs.setup-android == 'true' }}
      shell: bash
      run: |
        ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -f "$SDKMANAGER" ]; then
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/bin/sdkmanager"
        fi
        if [ ! -f "$SDKMANAGER" ]; then
          echo "sdkmanager not found at $ANDROID_SDK" >&2
          ls "$ANDROID_SDK/cmdline-tools/" 2>/dev/null || echo "No cmdline-tools found" >&2
          exit 1
        fi
        # Accept all licenses non-interactively.
        # sdkmanager may close stdin before yes finishes, causing SIGPIPE.
        # Use || true to avoid spurious failures with pipefail.
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        # Install required SDK platforms and build-tools.
        yes | "$SDKMANAGER" "platforms;android-36" || true
        yes | "$SDKMANAGER" "build-tools;36.0.0" || true
        yes | "$SDKMANAGER" "build-tools;29.0.3" || true
