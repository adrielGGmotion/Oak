name: 'Setup Oak Build Environment'
description: 'Sets up JDK, Gradle caching, and optionally Android SDK'
inputs:
  setup-android:
    description: 'Whether to setup Android SDK'
    required: false
    default: 'false'
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'

runs:
  using: 'composite'
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set execution flag for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: Setup Android SDK
      if: ${{ inputs.setup-android == 'true' }}
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Platform and Build Tools
      if: ${{ inputs.setup-android == 'true' }}
      shell: bash
      run: |
        sdkmanager "platforms;android-37"
        sdkmanager "build-tools;37.0.0"
        sdkmanager "build-tools;29.0.3"
